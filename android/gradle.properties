# Gradle 8.14 + the Android Gradle Plugin require a JVM 11+ to run the
# build (classpath resolution, Kotlin daemon, etc.). If your shell still
# picks Java 8 from PATH, Gradle will fail with:
#   "Dependency requires at least JVM runtime version 11. This build uses a Java 8 JVM."
#
# This line forces the Gradle daemon to use JDK 17 regardless of PATH.
# Edit the path if your JDK lives elsewhere (e.g. Android Studio JBR:
#   C:/Program Files/Android/Android Studio/jbr
# ).
org.gradle.java.home=C:/Program Files/Java/jdk-17

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
